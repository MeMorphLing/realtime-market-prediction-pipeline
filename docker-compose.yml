services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend
      - ./data:/app/data
      - ./mlruns:/app/mlruns
      - ./checkpoints:/app/checkpoints
      - ./reports:/app/reports
    depends_on:
      - mlflow
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: market-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root /mlflow/mlruns
    restart: unless-stopped

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: market-airflow
    ports:
      - "8080:8080"
    environment:
      # Standalone uses SQLite + SequentialExecutor — no Postgres needed.
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - PYTHONPATH=/opt/airflow
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./checkpoints:/opt/airflow/checkpoints
      - ./mlruns:/opt/airflow/mlruns
      - airflow-state:/opt/airflow/logs
    command: standalone
    depends_on:
      - mlflow
    restart: unless-stopped

volumes:
  airflow-state:
